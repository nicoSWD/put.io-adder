[workspace]
resolver = "3"
members = ["crates/putio-api", "crates/putio-core", "crates/putio-platform", "crates/putio-adder"]

[workspace.package]
version = "4.0.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/nicoSWD/put.io-adder"
authors = ["Nicolas Oelgart"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
