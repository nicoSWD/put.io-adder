[package]
name = "putio-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The production HTTP transport. `putio-core` turns it off, so "core has no I/O" is structural: its
# dependency tree contains no HTTP or TLS code.
default = ["http"]
http = ["dep:ureq"]
# In-memory FakeTransport for other crates' tests.
testing = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"], optional = true }
zeroize = "1.9.1"

[lints]
workspace = true
