[package]
name = "putio-adder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# eframe's defaults, except `wgpu` (which switches on egui-wgpu's `macos-window-resize-jitter-fix`):
# that fix presents Metal frames inside the Core Animation transaction while the window resizes, which
# deadlocks `nextDrawable` for a second at a time during the animated resize. The renderer is still
# wgpu, with the same wgpu features egui-wgpu enables by default.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "wgpu_no_default_features",
    "x11",
] }
egui-wgpu = { version = "0.37.0", default-features = false }
wgpu = { version = "30.0.1", features = ["metal"] }
# eframe's default `winit/default`: winit with its default features.
winit = "0.30.13"
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
putio-api = { path = "../putio-api" }
putio-core = { path = "../putio-core" }
putio-platform = { path = "../putio-platform" }
sys-locale = "0.3.2"

[dev-dependencies]
putio-api = { path = "../putio-api", features = ["testing"] }

[lints]
workspace = true
