name: Release

# Push a signed tag such as `v0.2.0` (made by tools/release.sh) to build every platform and publish a
# GitHub release. Tags with a hyphen (`v0.2.0-rc.1`) are published as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.2.0)"
        required: true

# Nothing by default; every job asks for exactly what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Only the maintainer can release: the tag must be an annotated tag whose signature GitHub
      # verified, made by the e-mail stored in the repository variable RELEASE_TAGGER_EMAIL.
      # GitHub verifies the signature when the tag is pushed and can lag a moment, hence the retries.
      - name: Tag is signed by the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTAINER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
        run: |
          if [ -z "$MAINTAINER_EMAIL" ]; then
            echo "::error::Set the repository variable RELEASE_TAGGER_EMAIL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            kind=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.type)
            if [ "$kind" != "tag" ]; then
              echo "::error::${RELEASE_TAG} is a lightweight tag. Release with tools/release.sh, which signs it."
              exit 1
            fi
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)
            if gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" | jq -e --arg email "$MAINTAINER_EMAIL" --arg tag "$RELEASE_TAG" '
                .verification.verified == true and .verification.reason == "valid"
                and .tag == $tag and .object.type == "commit"
                and (.tagger.email | ascii_downcase) == ($email | ascii_downcase)' >/dev/null; then
              echo "${RELEASE_TAG} is signed by ${MAINTAINER_EMAIL}"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::${RELEASE_TAG} is not a verified tag by ${MAINTAINER_EMAIL}. Release with tools/release.sh."
          exit 1

      # `git push origin main vX` starts CI and this workflow at the same moment, so wait for CI on the
      # tagged commit (up to 45 minutes) instead of failing because it has not finished yet.
      - name: Tag commit is on main and CI passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::${RELEASE_TAG} is not on main"; exit 1; }
          deadline=$((SECONDS + 2700))
          while :; do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --json status,conclusion)
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' >/dev/null; then
              echo "CI passed for $sha"; break
            fi
            if echo "$runs" | jq -e 'length > 0 and all(.[]; .status == "completed")' >/dev/null; then
              echo "::error::CI finished without succeeding for $sha"; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI on $sha"; exit 1
            fi
            echo "waiting for CI on $sha…"; sleep 30
          done

      - name: Tag matches Cargo.toml
        id: version
        run: |
          cargo_version=$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]") } in_pkg && /^version = "/ { gsub(/^version = "|"$/, ""); print; exit }' Cargo.toml)
          tag_version="${RELEASE_TAG#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match Cargo.toml version ${cargo_version}. Use tools/release.sh."
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  sbom:
    name: SBOM and licence list
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - run: |
          mkdir -p dist
          python3 tools/sbom.py --out dist/sbom.cdx.json --licenses dist/THIRD_PARTY.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: |
            dist/sbom.cdx.json
            dist/THIRD_PARTY.txt
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: [verify, sbom]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,   os: macos-latest,      target: aarch64-apple-darwin,      arch: arm64,   kind: macos }
          - { name: macos-x64,     os: macos-15-intel,    target: x86_64-apple-darwin,       arch: x64,     kind: macos }
          - { name: windows-x64,   os: windows-latest,    target: x86_64-pc-windows-msvc,    arch: x64,     kind: windows }
          - { name: windows-arm64, os: windows-11-arm,    target: aarch64-pc-windows-msvc,   arch: arm64,   kind: windows }
          # Linux is built on the OLDEST distribution we support (Ubuntu 22.04, glibc 2.35): a binary needs
          # the glibc it was linked against, and tools/check-glibc.py enforces the floor.
          - { name: linux-x64,     os: ubuntu-22.04,      target: x86_64-unknown-linux-gnu,  arch: x86_64, kind: linux }
          - { name: linux-arm64,   os: ubuntu-22.04-arm,  target: aarch64-unknown-linux-gnu, arch: aarch64, kind: linux }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # No build cache in a release build: a poisoned cache would end up in a signed artifact.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev pkg-config

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sbom
          path: dist

      - name: Build
        shell: bash
        run: |
          flags="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo"
          # Windows: link the C runtime statically so the zip runs without the VC++ redistributable.
          [ "${{ matrix.kind }}" = "windows" ] && flags="$flags -C target-feature=+crt-static"
          RUSTFLAGS="$flags" cargo build --locked --release -p putio-adder --target "$TARGET"

      # ---- Linux ----
      - name: Check the glibc floor
        if: matrix.kind == 'linux'
        run: python3 tools/check-glibc.py "target/$TARGET/release/putio-adder" --max 2.35
      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: tools/package-linux.sh "target/$TARGET/release/putio-adder" "$VERSION" "${{ matrix.arch }}"

      # ---- macOS ----
      # Bundles the binary built above (with its reproducibility flags); it does not build again.
      - name: Bundle (macOS)
        if: matrix.kind == 'macos'
        run: PUTIO_BINARY="target/$TARGET/release/putio-adder" tools/bundle-macos.sh "$TARGET"
      - name: Sign and notarize (macOS)
        if: matrix.kind == 'macos'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -n "$MACOS_SIGN_IDENTITY" ] && [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            tools/sign-macos.sh "dist/$TARGET/put.io adder.app"
            echo "notarized" > "dist/signing-${{ matrix.name }}.txt"
          else
            echo "::warning::No Apple signing secrets: this macOS build is ad-hoc signed (users must right-click > Open)."
            echo "ad-hoc" > "dist/signing-${{ matrix.name }}.txt"
          fi
      - name: Disk image (macOS)
        if: matrix.kind == 'macos'
        run: tools/make-dmg.sh "dist/$TARGET/put.io adder.app" "dist/putio-adder-v$VERSION-macos-${{ matrix.arch }}.dmg"

      # ---- Windows ----
      - name: Install Inno Setup (Windows)
        if: matrix.kind == 'windows'
        shell: bash
        run: tools/install-inno-setup.sh
      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: bash
        run: tools/package-windows.sh "target/$TARGET/release/putio-adder.exe" "$VERSION" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/signing-*.txt
          if-no-files-found: error

  publish:
    name: Publish
    needs: [verify, sbom, build]
    runs-on: ubuntu-22.04
    # Create a protected environment named "release" with required reviewers: nothing is published
    # until a human approves.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum *.dmg *.zip *.tar.gz *-setup.exe sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      # Signed statements (Sigstore) that these exact files were built by this workflow from this tag.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/sbom.cdx.json

      - name: Release notes
        run: |
          {
            echo "## Downloads"
            echo
            echo "| Platform | Files |"
            echo "|---|---|"
            echo "| macOS (Apple Silicon / Intel) | \`putio-adder-v${VERSION}-macos-arm64.dmg\`, \`putio-adder-v${VERSION}-macos-x64.dmg\` |"
            echo "| Windows (x64 / arm64) | \`...-windows-x64-setup.exe\` or \`.zip\`, \`...-windows-arm64-setup.exe\` or \`.zip\` |"
            echo "| Linux (x86_64 / aarch64) | \`putio-adder-v${VERSION}-linux-x86_64.tar.gz\`, \`...-linux-aarch64.tar.gz\` |"
            echo
            if grep -q ad-hoc dist/signing-*.txt; then
              echo "> **macOS:** this build is not notarized. Right-click the app, choose *Open*, and confirm once."
              echo
            fi
            echo "## Verify what you downloaded"
            echo
            echo '```'
            echo "shasum -a 256 -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify <file> --repo ${GH_REPO}"
            echo '```'
            echo
            echo "\`sbom.cdx.json\` is the CycloneDX software bill of materials. See SECURITY.md."
          } > notes.md

      - name: Create the release
        run: |
          prerelease=""
          case "$RELEASE_TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$RELEASE_TAG" dist/*.dmg dist/*.zip dist/*.tar.gz dist/*-setup.exe dist/sbom.cdx.json dist/SHA256SUMS \
            --verify-tag --generate-notes --notes-file notes.md --title "put.io adder $VERSION" $prerelease
